<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Quicklook Anything app icon. Render at 1024 x 1024 (for example with headless Chrome) and
       resize into LocalBuild/Assets.xcassets/AppIcon.appiconset (16 to 512 pt, @1x and @2x). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EEF0F4"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F8BFF"/>
      <stop offset="1" stop-color="#2F54EB"/>
    </linearGradient>
    <linearGradient id="handle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2E3440"/>
      <stop offset="0.5" stop-color="#4C5566"/>
      <stop offset="1" stop-color="#262B35"/>
    </linearGradient>
    <linearGradient id="lens" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F3F7FF"/>
      <stop offset="1" stop-color="#DCE7FF"/>
    </linearGradient>
    <filter id="iconShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.22"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#1B2A6B" flood-opacity="0.22"/>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" filter="url(#iconShadow)"/>
  <rect x="100.5" y="100.5" width="823" height="823" rx="184.5" fill="none" stroke="#000" stroke-opacity="0.06"/>
  <g transform="translate(22 22)">
  <g filter="url(#soft)">
    <rect x="602" y="560" width="96" height="250" rx="48" fill="url(#handle)" transform="rotate(-45 650 685)"/>
    <circle cx="460" cy="460" r="222" fill="url(#ring)"/>
  </g>
  <circle cx="460" cy="460" r="172" fill="url(#lens)"/>
  <path d="M330 460 Q460 340 590 460 Q460 580 330 460 Z" fill="#FFFFFF" stroke="#2F54EB" stroke-width="22" stroke-linejoin="round"/>
  <circle cx="460" cy="460" r="48" fill="#2F54EB"/>
  </g>
</svg>
